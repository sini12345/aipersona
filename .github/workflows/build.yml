name: Build Ali Executables

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Tillader manuel triggering

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install anthropic pyinstaller
    
    - name: Build Windows executable
      run: |
        pyinstaller --onefile --noconsole --name Ali-Trainer ali_hybrid.py
    
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v3
      with:
        name: ali-windows
        path: dist/Ali-Trainer.exe

  build-mac:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install anthropic pyinstaller
    
    - name: Build macOS app
      run: |
        pyinstaller --onefile --windowed --name Ali-Trainer ali_hybrid.py
    
    - name: Upload macOS artifact
      uses: actions/upload-artifact@v3
      with:
        name: ali-macos
        path: dist/Ali-Trainer.app

  create-release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v3
      with:
        name: ali-windows
        path: ./windows
    
    - name: Download macOS artifact
      uses: actions/download-artifact@v3
      with:
        name: ali-macos
        path: ./macos
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Ali Trainer v${{ github.run_number }}
        files: |
          ./windows/Ali-Trainer.exe
          ./macos/Ali-Trainer.app
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
